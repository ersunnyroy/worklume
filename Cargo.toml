# Rust workspace for the desktop agent and its shared crates.
# The Tauri shell arrived in E00-S09; E09-S01 added core, sync, storage and platform.
# Allowed dependencies between them are checked by apps/desktop/scripts/check-crate-boundaries.mjs.
[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/desktop/core",
  "apps/desktop/platform",
  "apps/desktop/storage",
  "apps/desktop/sync",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
# Unsafe code is limited to the per-OS platform adapters, which opt in
# explicitly and must document every block (see clippy below).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
# Smaller, faster agent binaries. Debug symbols for crash reports arrive with E09-S11.
lto = true
codegen-units = 1
