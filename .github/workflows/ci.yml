# Checks every pull request and every push to main (E00-S04, first part).
# The desktop and mobile native builds run in their own workflows when those apps change.
# API image builds and deploys to dev arrive once the API (E00-S02) and infrastructure
# (E00-S03) exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly security scan, so new advisories surface without a code change.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install root tooling
        run: pnpm install --frozen-lockfile --filter worklume
      # Pull requests are squash-merged, so the title becomes the commit on main.
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      - name: Lint the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  checks:
    name: Lint, typecheck, test and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      # The desktop app needs Rust and WebKitGTK; desktop.yml checks it on every OS.
      - name: Lint, typecheck, test and build
        run: pnpm exec turbo run lint typecheck test build --filter='!@worklume/desktop'
      - name: Check that generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error title=Generated files changed::The build changed tracked files (for example apps/web/src/routeTree.gen.ts). Run the build locally and commit the result."
            exit 1
          fi
      - name: Install the Playwright browser
        run: pnpm --filter @worklume/web exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm exec turbo run test:e2e --filter=@worklume/web
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SEMGREP_VERSION: 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history for secrets (gitleaks)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      # Fails on high and critical advisories; moderate ones are reviewed in the weekly run.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Static analysis (Semgrep)
        run: |
          python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          status=0
          semgrep scan --error --metrics=off --json --output semgrep.json \
            --config p/default --config p/github-actions --config p/secrets || status=$?
          # Turn each finding into an annotation on the file and line it concerns.
          python3 .github/scripts/semgrep-annotations.py semgrep.json
          exit "$status"
