# Builds unsigned desktop installers on every OS the agent supports (E00-S09), and tests the
# agent against each OS's credential store (E09-S02). Signing and notarisation arrive with
# E10-E13; releases with E09-S10.
name: Desktop

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/api-contract/**'
      - 'packages/eslint-config/**'
      - 'packages/tsconfig/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/api-contract/**'
      - 'packages/eslint-config/**'
      - 'packages/tsconfig/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-15
          - name: Windows
            os: windows-2025
          # The oldest supported Ubuntu, so the .deb and AppImage run on 22.04 and later.
          - name: Ubuntu 22.04
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The debug build, its tests and the release build together outgrow a Linux runner's free
      # disk. The runner's preinstalled .NET, Android, Haskell and CodeQL toolchains are unused.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libdbus-1-dev pkg-config gnome-keyring xvfb libpipewire-0.3-dev libclang-dev

      # Ubuntu 22.04's PipeWire (0.3.48) is older than the pipewire crate's headers need. Build
      # against Ubuntu 24.04's PipeWire 1.0.5 headers, still linking against 22.04's library, so a
      # function 0.3.48 lacks fails the link (docs/conventions/desktop.md, "PipeWire on Ubuntu
      # 22.04").
      - name: Use newer PipeWire headers (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        run: echo "PKG_CONFIG_PATH=$(apps/desktop/scripts/pipewire-headers.sh "$RUNNER_TEMP/pipewire")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        id: checks
        run: pnpm exec turbo run lint typecheck test --filter=@worklume/desktop

      # Clippy errors, build failures (a build script or the linker) and failed Rust tests are
      # repeated as one annotation, so they show on the pull request without opening the full log. Everything is already built, so this adds
      # about a minute. (The Actions bash shell sets pipefail; grep finding nothing is fine here.)
      - name: Annotate Rust failures
        if: failure() && steps.checks.outcome == 'failure'
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings > clippy.log 2>&1 || true
          cargo test --workspace --locked --no-fail-fast > cargo-test.log 2>&1 || true
          { grep -E '^[^ ].*: (error|warning)' clippy.log || true; grep -E -A15 '^error(\[|:)' clippy.log || true; grep -E -A4 '^---- |panicked at' cargo-test.log || true; } > rust-failures.log
          summary=$(head -80 rust-failures.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$summary" ]; then
            echo "::error title=Rust failures::${summary}"
          else
            echo "::error title=Checks failed::No Clippy error or Rust test failure; see the Lint, typecheck and test step."
          fi

      # The OS credential store tests are ignored in ordinary runs because they touch the real
      # keychain. On Linux, GNOME Keyring runs unlocked inside a throwaway D-Bus session.
      - name: Test against the OS credential store
        if: runner.os != 'Linux'
        run: cargo test -p worklume-platform --test os_secret_store --locked -- --ignored

      - name: Test against the OS credential store (GNOME Keyring)
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && cargo test -p worklume-platform --test os_secret_store --locked -- --ignored'

      # The X11 adapters against a real X server, with input faked through XTEST, and the
      # session lock against stand-in logind and screen saver services on a private bus
      # (E12-S03, E12-S04). Then the real app's tray against a stand-in StatusNotifierWatcher,
      # the service stock Ubuntu's AppIndicator extension provides (E12-S05).
      - name: Test the Linux sensors and tray (Xvfb and D-Bus)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a dbus-run-session -- sh -c '
          cargo test -p worklume-platform --features fake --lib --test x11 --locked -- --ignored
          && cargo test -p worklume-desktop --test tray_linux --locked -- --ignored'

      - name: Build unsigned installers
        run: pnpm --filter @worklume/desktop build:app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worklume-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The Wayland readers against real services and stand-ins: idle time against a headless sway
  # and a stand-in Mutter (E13-S04), the GNOME window against a stand-in extension (E13-S05), the
  # KDE window against KWin 5.27 on its virtual backend (E13-S06), and screen capture against a
  # stand-in portal sharing a PipeWire test source (E13-S03). Ubuntu
  # 22.04's sway is too old to have ext-idle-notify-v1, so this runs on 24.04, apart from the
  # 22.04 build.
  wayland:
    name: Wayland idle readers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sway, KWin, PipeWire, GStreamer and the D-Bus library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway kwin-wayland libdbus-1-dev \
            pkg-config dbus libpipewire-0.3-dev libclang-dev pipewire pipewire-bin wireplumber \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-pipewire

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test the Wayland readers (sway, KWin, PipeWire, and stand-ins for Mutter, the GNOME extension and the portal)
        id: wayland-tests
        shell: bash
        run: >-
          dbus-run-session -- cargo test -p worklume-platform --features fake --test wayland
          --test mutter --test gnome --test plasma --test portal --locked --no-fail-fast
          -- --ignored 2>&1 | tee wayland-tests.log

      # Failed tests are repeated as one annotation, since the job's log can't be read from the
      # pull request without opening it.
      - name: Annotate failed Wayland tests
        if: failure() && steps.wayland-tests.outcome == 'failure'
        shell: bash
        run: |
          { grep -E '^test .* FAILED$' wayland-tests.log || true; grep -E -A8 '^---- |panicked at' wayland-tests.log || true; } > wayland-failures.log
          summary=$(head -80 wayland-failures.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wayland test failures::${summary:-No failed test found; see the test step.}"
