[package]
name = "worklume-simulation"
description = "Worklume desktop agent: the simulation harness. The agent core runs on a simulated device against a fake server, and scripted or generated scenarios check its invariants. Test support only; the app never depends on it."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = "1.26.1"
worklume-core = { path = "../core" }
# The harness drives the fakes and injects store failures. Both features stay out of the app,
# because nothing the app builds depends on this crate (see scripts/crate-boundaries.mjs).
worklume-platform = { path = "../platform", features = ["fake"] }
worklume-storage = { path = "../storage", features = ["fault-injection"] }
worklume-sync = { path = "../sync" }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
