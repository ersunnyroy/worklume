[package]
name = "worklume-core"
description = "Worklume desktop agent: tracking rules, slots, screenshot scheduling, idle and policy."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The Public Suffix List, compiled in, to keep websites as their registrable domain.
psl = "2.1.238"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
worklume-platform = { path = "../platform" }
worklume-storage = { path = "../storage" }

[dev-dependencies]
tempfile = "3.27.0"
worklume-platform = { path = "../platform", features = ["fake"] }
worklume-storage = { path = "../storage", features = ["fault-injection"] }

[lints]
workspace = true
