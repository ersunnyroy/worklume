[package]
name = "worklume-desktop"
description = "Worklume desktop agent: the tray-resident Tauri shell."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tests live in tests/ as integration tests: on Windows only those executables can be given the
# Common-Controls manifest that Tauri needs (see build.rs), so no unit-test harness is built.
[lib]
name = "worklume_desktop"
test = false
doctest = false

[[bin]]
name = "worklume-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }

[dev-dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "test"] }

[lints]
workspace = true
