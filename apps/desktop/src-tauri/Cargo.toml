[package]
name = "worklume-desktop"
description = "Worklume desktop agent: the tray-resident Tauri shell."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tests live in tests/ as integration tests: on Windows only those executables can be given the
# Common-Controls manifest that Tauri needs (see build.rs), so no unit-test harness is built.
[lib]
name = "worklume_desktop"
test = false
doctest = false

[[bin]]
name = "worklume-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
# The device's time zone, for the start of the member's day.
jiff = "0.2.37"
# Crash reports, sent through worklume-sync's HTTPS client (OS certificate store, proxies).
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "native-tls"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "~2.11.5", features = ["tray-icon"] }
# 2.5 requires tauri 2.12; stay on the plugin line that matches the pinned tauri 2.11.
tauri-plugin-single-instance = "~2.4.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.26.1"
worklume-core = { path = "../core" }
worklume-platform = { path = "../platform" }
worklume-storage = { path = "../storage" }
worklume-sync = { path = "../sync" }

[dev-dependencies]
sentry = { version = "0.49.2", default-features = false, features = ["test"] }
worklume-platform = { path = "../platform", features = ["fake"] }
serde_json = "1"
tempfile = "3.27.0"
tauri = { version = "~2.11.5", features = ["tray-icon", "test"] }

[lints]
workspace = true
