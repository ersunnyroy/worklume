[package]
name = "worklume-desktop"
description = "Worklume desktop agent: the tray-resident Tauri shell."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "worklume_desktop"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }

[dev-dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "test"] }

[lints]
workspace = true
