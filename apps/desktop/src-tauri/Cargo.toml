[package]
name = "worklume-desktop"
description = "Worklume desktop agent: the tray-resident Tauri shell."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tests live in tests/ as integration tests: on Windows only those executables can be given the
# Common-Controls manifest that Tauri needs (see build.rs), so no unit-test harness is built.
[lib]
name = "worklume_desktop"
test = false
doctest = false

[[bin]]
name = "worklume-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "~2.11.5", features = ["tray-icon"] }
# 2.5 requires tauri 2.12; stay on the plugin line that matches the pinned tauri 2.11.
tauri-plugin-single-instance = "~2.4.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
worklume-core = { path = "../core" }
worklume-platform = { path = "../platform" }

[dev-dependencies]
serde_json = "1"
tauri = { version = "~2.11.5", features = ["tray-icon", "test"] }

[lints]
workspace = true
