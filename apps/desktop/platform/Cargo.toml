[package]
name = "worklume-platform"
description = "Worklume desktop agent: operating-system integration behind traits, one adapter per OS."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles for other crates' tests and the simulation harness. Never enabled in the app.
fake = []

[dependencies]
keyring-core = "1.0.0"
thiserror = "2.0.18"
zeroize = "1.8.2"

# One credential store per OS, each linked only on its own target, plus the OS clock APIs.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
# The default `search` feature pulls in regex for a feature the agent does not use.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Encrypts the D-Bus session with the Secret Service in pure Rust; links the system libdbus.
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
# The same libdbus binding, for logind and the screen saver service (E12-S03).
dbus = "0.9.12"
libc = "0.2.189"
# Waits on the X connection with a timeout, so the input reader can stop.
rustix = { version = "1.1.5", features = ["event"] }
# The X11 protocol in pure Rust: no libX11 or libxcb at run time.
x11rb = { version = "0.13.2", features = ["screensaver", "xinput"] }

# Fakes input through XTEST in the X11 tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[lints]
workspace = true
