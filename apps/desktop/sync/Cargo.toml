[package]
name = "worklume-sync"
description = "Worklume desktop agent: drains the outbox to the API in ordered, idempotent batches."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Blocking HTTP with the OS TLS stack; the agent's workers are threads, not an async runtime.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
worklume-core = { path = "../core" }
worklume-storage = { path = "../storage" }

[lints]
workspace = true
