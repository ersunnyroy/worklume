[package]
name = "worklume-storage"
description = "Worklume desktop agent: encrypted local store (SQLCipher) for the journal, outbox and spool."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
getrandom = "0.4.2"
hkdf = "0.13.0"
# SQLCipher is compiled in, with OpenSSL built from source as its crypto provider on every OS,
# so no system library decides whether the store is encrypted.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
uuid = { version = "1.26.1", features = ["v7"] }
worklume-platform = { path = "../platform" }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
