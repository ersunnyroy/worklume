openapi: 3.1.1
info:
  title: Worklume API
  version: 1.0.0
  summary: The single REST API behind the web app, the mobile app, the desktop agent and integrations.
  description: |
    Contract-first: this document is the source of truth. The API implements it, clients are
    generated from it, and CI fails when the two drift apart.

    Conventions that apply to every operation are described once, in the architecture's API
    catalog (`docs/planning/phase-2-api.md`), and enforced by the Spectral rules in this package:

    - The organization is always taken from the access token. No tenant operation accepts an
      organization ID from the client.
    - JSON bodies use `snake_case`; timestamps are UTC ISO 8601.
    - Errors are RFC 9457 problem details (`application/problem+json`) with a stable `code` and
      the `request_id` to quote to support.
  contact:
    name: Worklume engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.worklume.com
    description: Production
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Platform
    description: Service health, used by load balancers and uptime checks.
  - name: Desktop
    description: |
      The agent protocol (`/v1/desktop/*`), served by the ingest service. Calls need a
      DPoP-bound device token whose device is active and belongs to the token's member.
security:
  - bearerAuth: []
paths:
  /health:
    x-worklume-unversioned: true
    get:
      operationId: getHealth
      tags: [Platform]
      summary: Liveness check
      description: |
        Answers as long as the process can serve requests. It checks no dependencies, so a
        failing database never makes the load balancer restart healthy API processes.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        default:
          $ref: '#/components/responses/Problem'
  /ready:
    x-worklume-unversioned: true
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Readiness check
      description: |
        Answers 200 only when the API can serve traffic: the database and cache respond. The
        response never names the failing dependency, because this endpoint is reachable without
        authentication.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: ready
        '503':
          description: A dependency is unavailable; the load balancer should route elsewhere.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.worklume.com/errors/service_unavailable
                title: Service unavailable
                status: 503
                code: service_unavailable
                request_id: 0192f0a4-7c1e-7d3a-9b2f-5d8e6a4c3b21
        default:
          $ref: '#/components/responses/Problem'
  /v1/desktop/sync:
    post:
      operationId: syncDesktopEvents
      tags: [Desktop]
      summary: Upload a batch of outbox events
      description: |
        The agent sends its outbox in `seq` order, up to 500 events or 5 MB per batch, and
        deletes events only once they are acknowledged (`accepted` or `duplicate`). The server
        applies events in `seq` order inside one transaction per member and answers per event.

        Retries are safe twice over: the server replays its stored response for a `batch_id` it
        has seen, and inserts use each `event_id` as the key, so a repeated event is reported as
        `duplicate`.

        Every ID in an event comes from the device, so the server checks each one: projects and
        tasks must be assigned to the member, and time entries, idle periods and breaks must
        belong to this device. The organization always comes from the token.

        The server's obligations for each event type are in the event schemas' descriptions.
      x-worklume-idempotency: client-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopSyncBatch'
      responses:
        '200':
          description: The batch was processed; each event has a verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopSyncResult'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/desktop/capabilities:
    put:
      operationId: putDesktopCapabilities
      tags: [Desktop]
      summary: Report what the agent can measure on this device
      description: |
        The agent sends its capability map when it starts and whenever the map changes; it
        checks once a minute. The map replaces the device's `capabilities`, so a repeated
        report changes nothing. The device is the token's device: the body names none.

        Each feature has a status and the reasons for it, as codes the dashboard explains in
        the viewer's language. A device whose features are not all `granted` is shown as
        reduced ("Wayland: reduced" for `linux_wayland`), with the reasons, so a member's
        missing screenshots or apps read as a limit of their desktop rather than as gaps.

        The server alerts the organization's admins when a feature becomes `denied`, and
        ignores a `platform` that differs from the one the device registered with (it logs
        it). At most one report a minute per device; more are refused with 429.
      x-worklume-idempotency: natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopCapabilities'
      responses:
        '204':
          description: The device's capability map was replaced.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          description: More than one report a minute from this device.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (15 minutes), bound to one organization. Desktop and mobile clients also
        send a `DPoP` proof header (RFC 9449).
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  responses:
    Problem:
      description: An error, described as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable code and the request ID.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          description: Documentation URL for this kind of error.
        title:
          type: string
          description: Short, human-readable summary that does not change between occurrences.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Stable, machine-readable error code, such as `validation_failed`.
        detail:
          type: string
          description: Explanation of this occurrence. Never contains stack traces or internals.
        errors:
          type: array
          description: Per-field validation errors, present for `validation_failed`.
          items:
            $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
          description: Identifier of the request, to quote when contacting support.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Path of the invalid field in the request, such as `ended_at`.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
    DesktopSyncBatch:
      type: object
      additionalProperties: false
      required: [batch_id, first_seq, last_seq, events]
      properties:
        batch_id:
          type: string
          format: uuid
          description: Chosen by the agent and kept for every retry of this batch.
        first_seq:
          type: integer
          minimum: 1
        last_seq:
          type: integer
          minimum: 1
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DesktopEvent'
    DesktopSyncResult:
      type: object
      additionalProperties: false
      required: [applied_seq, results, commands]
      properties:
        applied_seq:
          type: integer
          minimum: 0
          description: The highest contiguous `seq` the server has applied for this device.
        results:
          type: array
          items:
            $ref: '#/components/schemas/DesktopEventResult'
        commands:
          type: array
          description: Commands waiting for this device.
          items:
            $ref: '#/components/schemas/DeviceCommand'
    DesktopEventResult:
      type: object
      additionalProperties: false
      required: [event_id, status]
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, duplicate, conflict, rejected]
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: >-
            Why, for `conflict` and `rejected`: `time_locked`, `limit_reached`,
            `project_unavailable`, `overlap_trimmed` or `clock_adjusted`.
        details:
          type: object
    DeviceCommand:
      type: object
      additionalProperties: false
      required: [id, command, payload]
      properties:
        id:
          type: string
          format: uuid
        command:
          type: string
          enum: [refresh_config, force_sync, upload_logs, stop_timer, sign_out]
        payload:
          type: object
    DesktopEvent:
      description: |
        One outbox event. The envelope is the same for every type (architecture §13); `type`
        decides the payload. The envelope time is the moment the change took effect, which is not
        always when it was recorded: `idle.detected` is dated when idle began, a restart's
        `timer.stopped` at the agent's last snapshot, and `slot.closed` and its usage batches at
        the end of the slot's window.
      oneOf:
        - $ref: '#/components/schemas/TimerStartedEvent'
        - $ref: '#/components/schemas/TimerStoppedEvent'
        - $ref: '#/components/schemas/IdleDetectedEvent'
        - $ref: '#/components/schemas/IdleResolvedEvent'
        - $ref: '#/components/schemas/BreakStartedEvent'
        - $ref: '#/components/schemas/BreakEndedEvent'
        - $ref: '#/components/schemas/SlotClosedEvent'
        - $ref: '#/components/schemas/AppUsageBatchEvent'
        - $ref: '#/components/schemas/UrlUsageBatchEvent'
      discriminator:
        propertyName: type
        mapping:
          timer.started: '#/components/schemas/TimerStartedEvent'
          timer.stopped: '#/components/schemas/TimerStoppedEvent'
          idle.detected: '#/components/schemas/IdleDetectedEvent'
          idle.resolved: '#/components/schemas/IdleResolvedEvent'
          break.started: '#/components/schemas/BreakStartedEvent'
          break.ended: '#/components/schemas/BreakEndedEvent'
          slot.closed: '#/components/schemas/SlotClosedEvent'
          app_usage.batch: '#/components/schemas/AppUsageBatchEvent'
          url_usage.batch: '#/components/schemas/UrlUsageBatchEvent'
    DesktopEventEnvelope:
      type: object
      required: [event_id, seq, type, wall_time, mono_time, clock_offset_ms, payload]
      properties:
        event_id:
          type: string
          format: uuid
          description: >-
            UUIDv7 made on the device. For events that create a row (a time entry, idle period,
            break or slot), it becomes that row's ID.
        seq:
          type: integer
          minimum: 1
          description: Position in this device's outbox sequence; never reused.
        type:
          type: string
        wall_time:
          type: string
          format: date-time
          description: >-
            The device's time for the change, derived from monotonic time since the boot's first
            reading, so changing the system clock does not move it.
        mono_time:
          $ref: '#/components/schemas/DesktopMonotonicTime'
        clock_offset_ms:
          type: [integer, 'null']
          description: The last measured device-minus-server offset; null until the first sync.
        payload:
          type: object
    DesktopMonotonicTime:
      type: object
      additionalProperties: false
      required: [ms, boot_id]
      properties:
        ms:
          type: integer
          minimum: 0
        boot_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Monotonic readings compare only within one boot.
    TimerStartedEvent:
      description: >-
        Opens a time entry, whose ID is the event ID, and starts the member's timer. The agent
        never opens an entry while another of its entries is open; conflicts with other devices
        follow architecture §13 (the earlier start wins).
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: timer.started
            payload:
              $ref: '#/components/schemas/TimerStartedPayload'
    TimerStartedPayload:
      type: object
      additionalProperties: false
      required: [project_id, task_id, trigger]
      properties:
        project_id:
          type: string
          format: uuid
        task_id:
          type: [string, 'null']
          format: uuid
        trigger:
          type: string
          enum: [user, switch, resume, break_end, gap_end, restart]
          description: >-
            `resume` after a pause, `break_end` after a break, `gap_end` after ticks stopped for
            over a minute, `restart` after the agent restarted.
    TimerStoppedEvent:
      description: >-
        Closes the open time entry `time_entry_id` at the event's time and stops the member's
        timer. Every reason except `user` and `switch` is a stop the member did not ask for, and
        is usually followed by a `timer.started` (trigger `resume`, `break_end`, `gap_end` or
        `restart`). Stopping while paused sends nothing, because the timer is already stopped.
        For `sleep`, the event's time is the agent's last reading before the device slept; after
        a sleep longer than the idle timeout, the timer resumes only when the member says so.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: timer.stopped
            payload:
              $ref: '#/components/schemas/TimerStoppedPayload'
    TimerStoppedPayload:
      type: object
      additionalProperties: false
      required: [time_entry_id, reason]
      properties:
        time_entry_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [user, switch, sleep, session_locked, break, gap, agent_restart]
    IdleDetectedEvent:
      description: >-
        Opens a pending idle period, whose ID is the event ID, starting at the event's time
        inside the entry `time_entry_id`. Until it is resolved, the period covers all of this
        device's tracked time from its start: when the agent restarts or a gap splits the entry
        meanwhile (`timer.stopped` with reason `agent_restart` or `gap`, then `timer.started`),
        it carries on into the new entry.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: idle.detected
            payload:
              $ref: '#/components/schemas/IdleDetectedPayload'
    IdleDetectedPayload:
      type: object
      additionalProperties: false
      required: [time_entry_id]
      properties:
        time_entry_id:
          type: string
          format: uuid
          description: The entry that was running when idle began.
    IdleResolvedEvent:
      description: >-
        The decision about an idle period, applied by the server as
        `POST /v1/idle-periods/{id}/resolve` would: `keep` counts the idle time; `discard`
        removes it from the entries it spans; `reassign` moves it to `reassigned_project_id`;
        `stop` removes it and stops the timer where idle began, ending the open entry, which is
        a later one than the period began in if the entry was split meanwhile. The idle period
        ends at the event's time, or where tracking stopped if that came first: the device
        slept while the decision was pending, and the pause's `timer.stopped` (reason `sleep`)
        came before this event. The agent sends no other event for a resolution. `decided_by: policy` marks a decision
        the organization's keep-idle policy made without asking (`always` sends `keep`, `never`
        sends `stop`); the server records it as `auto_kept` or `auto_discarded`. The server
        checks every decision against the member's effective keep-idle policy and applies the
        policy's outcome where they differ, so an agent cannot keep idle time under `never`.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: idle.resolved
            payload:
              $ref: '#/components/schemas/IdleResolvedPayload'
    IdleResolvedPayload:
      type: object
      additionalProperties: false
      required: [idle_period_id, time_entry_id, resolution, reassigned_project_id, decided_by]
      properties:
        idle_period_id:
          type: string
          format: uuid
        time_entry_id:
          type: string
          format: uuid
        resolution:
          type: string
          enum: [keep, discard, reassign, stop]
        reassigned_project_id:
          type: [string, 'null']
          format: uuid
          description: Set only for `reassign`.
        decided_by:
          type: string
          enum: [member, policy]
    BreakStartedEvent:
      description: >-
        Starts a work break, whose ID is the event ID. A running timer is closed by a
        `timer.stopped` with reason `break` just before.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: break.started
            payload:
              $ref: '#/components/schemas/BreakStartedPayload'
    BreakStartedPayload:
      type: object
      additionalProperties: false
      required: [break_policy_id]
      properties:
        break_policy_id:
          type: string
          format: uuid
    BreakEndedEvent:
      description: Ends the break `break_id`. A timer resumed after it follows as `timer.started`.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: break.ended
            payload:
              $ref: '#/components/schemas/BreakEndedPayload'
    BreakEndedPayload:
      type: object
      additionalProperties: false
      required: [break_id]
      properties:
        break_id:
          type: string
          format: uuid
    AppUsageBatchEvent:
      description: >-
        Time in each foreground application during one slot, sent right after its
        `slot.closed`. Only time while the timer ran and the member wasn't idle counts, so the
        seconds never exceed the slot's. The agent keeps only what the member's app and URL
        policy allows: nothing at level `off`, and window titles only when titles are on (never
        for a private browser window). The server matches `identifier` to the global
        application catalog for the device's platform, stores rows in `app_usage` against the
        slot `slot_id`, which must belong to this device, and drops titles the member's
        current policy forbids (E16-S02). Application usage is sensitive: it is readable only
        by the member and by roles with `activity.view_apps` in scope.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: app_usage.batch
            payload:
              $ref: '#/components/schemas/AppUsageBatchPayload'
    AppUsageBatchPayload:
      type: object
      additionalProperties: false
      required: [slot_id, slot_start, apps]
      properties:
        slot_id:
          type: string
          format: uuid
          description: The `event_id` of the slot's `slot.closed`.
        slot_start:
          type: string
          format: date-time
        apps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [identifier, name, title, seconds]
            properties:
              identifier:
                type: string
                minLength: 1
                maxLength: 256
                description: >-
                  Bundle ID (macOS), executable name (Windows) or desktop-file ID (Linux).
              name:
                type: string
                maxLength: 256
              title:
                type: [string, 'null']
                minLength: 1
                maxLength: 256
                description: The window title, only when the organization keeps titles.
              seconds:
                type: integer
                minimum: 1
                maximum: 600
    UrlUsageBatchEvent:
      description: >-
        Time on each website during one slot, sent right after its `slot.closed`, at the
        `domains` level and above. `domain` is the registrable domain (eTLD+1), or the whole
        host when it has no public suffix. `path` is set only at the `paths` level and never for
        a private window. Query strings, fragments and credentials never leave the device, nor
        do addresses that aren't web pages. A private window keeps its domain only, or is left
        out, by policy. The server stores rows in `url_usage` against the slot `slot_id`, which
        must belong to this device, and drops paths and private-window sites the member's
        current policy forbids (E16-S02). Website usage is sensitive: it is readable only by
        the member and by roles with `activity.view_urls` in scope.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: url_usage.batch
            payload:
              $ref: '#/components/schemas/UrlUsageBatchPayload'
    UrlUsageBatchPayload:
      type: object
      additionalProperties: false
      required: [slot_id, slot_start, sites]
      properties:
        slot_id:
          type: string
          format: uuid
          description: The `event_id` of the slot's `slot.closed`.
        slot_start:
          type: string
          format: date-time
        sites:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [domain, path, browser, private_window, seconds]
            properties:
              domain:
                type: string
                minLength: 1
                maxLength: 256
              path:
                type: [string, 'null']
                pattern: '^/[^?#]*$'
                maxLength: 512
                description: The URL path, only at the `paths` level; never a query or fragment.
              browser:
                type: string
                minLength: 1
                maxLength: 256
              private_window:
                type: boolean
              seconds:
                type: integer
                minimum: 1
                maximum: 600
    SlotClosedEvent:
      description: >-
        One 10-minute activity slot, whose ID is the event ID, dated at the end of its window.
        There is at most one per device and window. It belongs to the entry with the most time in
        it; time entries remain the source of truth for tracked time.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DesktopEventEnvelope'
        - type: object
          required: [type, payload]
          properties:
            type:
              const: slot.closed
            payload:
              $ref: '#/components/schemas/SlotClosedPayload'
    SlotClosedPayload:
      type: object
      additionalProperties: false
      required:
        - slot_start
        - time_entry_id
        - project_id
        - task_id
        - tracked_seconds
        - active_seconds
        - keyboard_seconds
        - mouse_seconds
        - idle_seconds
        - input_method
        - input_features
        - flags
      properties:
        slot_start:
          type: string
          format: date-time
          description: The window's start, aligned to :00, :10, :20… UTC.
        time_entry_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        task_id:
          type: [string, 'null']
          format: uuid
        tracked_seconds:
          type: integer
          minimum: 1
          maximum: 600
        active_seconds:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds with any input; never more than tracked.
        keyboard_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 600
          description: Null when the OS gives no keyboard and mouse split (Wayland).
        mouse_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 600
        idle_seconds:
          type: integer
          minimum: 0
          maximum: 600
        input_method:
          type: string
          enum: [hooks, idle_poll, portal]
        input_features:
          type: [object, 'null']
          description: >-
            Input timing statistics for the automated-input detector (E33-S03): the rhythm of
            key presses, clicks, pointer movements and scroll gestures while the timer ran and
            the member wasn't idle. Pointer or scroll reports less than 250 ms apart are one
            movement; intervals over 60 s are pauses and not counted; nothing spans idle time,
            a pause, a break or a restart. The device computes these from event times it then
            forgets: no event time, key or pointer position ever leaves it. Null when the slot
            had no input the agent could see (see `input_method`). Input features are
            sensitive: the server stores them with the slot for the detector, and no endpoint
            returns them.
          additionalProperties: false
          required: [version, events, keyboard_share, intervals]
          properties:
            version:
              type: integer
              const: 1
            events:
              type: object
              description: Inputs of each kind; at least one in all.
              additionalProperties: false
              required: [key, pointer, click, scroll]
              properties:
                key:
                  type: integer
                  minimum: 0
                pointer:
                  type: integer
                  minimum: 0
                click:
                  type: integer
                  minimum: 0
                scroll:
                  type: integer
                  minimum: 0
            keyboard_share:
              type: number
              minimum: 0
              maximum: 1
              description: Key presses as a share of all inputs, to 3 decimals.
            intervals:
              type: object
              description: >-
                Intervals between consecutive inputs of any kind, and of each kind. An interval
                belongs to the slot of the input that ends it.
              additionalProperties: false
              required: [any, key, pointer, click, scroll]
              properties:
                any:
                  $ref: '#/components/schemas/InputIntervals'
                key:
                  $ref: '#/components/schemas/InputIntervals'
                pointer:
                  $ref: '#/components/schemas/InputIntervals'
                click:
                  $ref: '#/components/schemas/InputIntervals'
                scroll:
                  $ref: '#/components/schemas/InputIntervals'
        flags:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [partial_slot, clock_adjusted]
    InputIntervals:
      type: [object, 'null']
      description: >-
        The intervals of one kind in a slot, or null when there were none. The statistics are
        null below 5 intervals, too few to judge a rhythm; `cv` is also null when every
        interval was 0 ms.
      additionalProperties: false
      required: [count, entropy_bits, cv]
      properties:
        count:
          type: integer
          minimum: 1
        entropy_bits:
          type: [number, 'null']
          minimum: 0
          maximum: 4
          description: >-
            Shannon entropy of the intervals over 16 log2 buckets of milliseconds, to 3
            decimals: near 0 for a machine repeating one interval.
        cv:
          type: [number, 'null']
          minimum: 0
          description: >-
            Coefficient of variation of the intervals (standard deviation over mean), to 3
            decimals.
    DesktopCapabilities:
      type: object
      description: >-
        What the agent can measure on this device, feature by feature, as its readers find it.
        It holds codes only: no app names, window titles, paths or user names.
      additionalProperties: false
      required: [platform, features]
      properties:
        platform:
          type: string
          enum: [macos, windows, linux_x11, linux_wayland]
          description: >-
            As `devices.platform`. A Linux agent without an X11 or Wayland session reports
            `linux_x11`, with `no_graphical_session` on every feature.
        desktop:
          type: string
          enum: [gnome, kde, other]
          description: >-
            The Linux desktop, from `XDG_CURRENT_DESKTOP`; absent on macOS and Windows, and
            when the session doesn't say.
        features:
          type: object
          additionalProperties: false
          required: [screenshots, activity, idle, apps, urls, session_lock]
          properties:
            screenshots:
              $ref: '#/components/schemas/DesktopCapability'
            activity:
              $ref: '#/components/schemas/DesktopCapability'
            idle:
              $ref: '#/components/schemas/DesktopCapability'
            apps:
              $ref: '#/components/schemas/DesktopCapability'
            urls:
              $ref: '#/components/schemas/DesktopCapability'
            session_lock:
              $ref: '#/components/schemas/DesktopCapability'
    DesktopCapability:
      type: object
      description: >-
        One feature: its status, and why. `granted` comes without reasons; every other status
        has at least one.
      additionalProperties: false
      required: [status, reasons]
      properties:
        status:
          $ref: '#/components/schemas/DesktopCapabilityStatus'
        reasons:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            $ref: '#/components/schemas/DesktopCapabilityReason'
      if:
        properties:
          status:
            const: granted
      then:
        properties:
          reasons:
            maxItems: 0
      else:
        properties:
          reasons:
            minItems: 1
    DesktopCapabilityStatus:
      type: string
      description: |
        - `granted`: measured fully.
        - `reduced`: measured, less precisely than on other desktops.
        - `pending`: waits for the member: a consent not yet given, or the next login.
        - `denied`: the member or the OS refused it.
        - `unsupported`: this desktop, or this version of the agent, can't measure it.
        - `failed`: the reader exists but isn't working.
      enum: [granted, reduced, pending, denied, unsupported, failed]
    DesktopCapabilityReason:
      type: string
      description: |
        - `not_implemented`: this version of the agent has no reader for it on this OS.
        - `no_graphical_session`: Linux without an X11 or Wayland session.
        - `adapter_failed`: the reader didn't start, or its last check failed.
        - `permission_denied`: the OS refused the reader a permission.
        - `consent_not_asked`: the desktop asks the member at the first screenshot (Wayland).
        - `consent_dialog_open`: the desktop is asking the member now.
        - `consent_declined`: the member declined screen sharing.
        - `no_screencast_portal`: the desktop offers no screen-cast portal.
        - `estimated_from_idle`: activity comes from the desktop's idle notices, second by
          second, not from input events (Wayland).
        - `idle_time_only`: activity comes from polling the idle time, without input events.
        - `no_keyboard_mouse_split`: one activity figure, not keyboard and mouse apart.
        - `idle_inhibitors_count_as_active`: while a window keeps the screen awake (a video),
          the member counts as active.
        - `gnome_extension_next_login`: the Worklume GNOME Shell extension loads at the
          member's next login.
        - `gnome_extension_disabled`: the member turned the Worklume extension off.
        - `gnome_extension_failed`: GNOME Shell couldn't run the extension.
        - `desktop_unsupported`: this desktop has no interface for it.
      enum:
        - not_implemented
        - no_graphical_session
        - adapter_failed
        - permission_denied
        - consent_not_asked
        - consent_dialog_open
        - consent_declined
        - no_screencast_portal
        - estimated_from_idle
        - idle_time_only
        - no_keyboard_mouse_split
        - idle_inhibitors_count_as_active
        - gnome_extension_next_login
        - gnome_extension_disabled
        - gnome_extension_failed
        - desktop_unsupported
