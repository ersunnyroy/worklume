packages:
  - 'apps/*'
  - 'packages/*'

# Fail installs on unsupported Node or pnpm versions instead of warning.
engineStrict: true
# Record exact versions; upgrades happen through reviewed dependency PRs.
saveExact: true
# Packages may run install scripts only when listed here with true. Listing false records a
# deliberate refusal: @scarf/scarf (pulled in by Spectral) only sends install analytics.
allowBuilds:
  '@scarf/scarf': false
# Refuse versions published less than seven days ago, so compromised releases are usually
# caught and pulled before they reach us. Setting it explicitly makes pnpm fail instead of
# silently adding exclusions. An urgent security fix can be allowed through
# minimumReleaseAgeExclude in a reviewed change.
minimumReleaseAge: 10080
# Refuse a version whose publishing is less trusted than earlier ones (for example, published
# without provenance after releases that had it), a common sign of a hijacked account. Only
# versions from the last 30 days are checked: older ones predate any takeover that is still
# undiscovered, and many long-lived versions (semver 6, undici-types 6) were published before
# their projects adopted provenance. A recent legitimate exception goes in trustPolicyExclude.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# Transitive dependencies may come only from the registry, never from Git URLs or tarballs.
blockExoticSubdeps: true
peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares TypeScript ^5 but generates correctly with 6.0; the generated
    # client is typechecked with 6.0 in CI, which would catch a break.
    openapi-typescript>typescript: '6'
# Security fixes for transitive dependencies, until their parents take them (reviewed in the
# Security scans job; see docs/conventions/ci.md, "Security scans").
overrides:
  shell-quote: ^1.11.0 # GHSA-pqg4-j6r4-53mv, via react-native's devtools
  source-map-js: ^1.2.2 # GHSA-68fv-2mgg-jv7q, via postcss in Expo and Vite
# Advisories with no fixed release, in development tooling only (never shipped in an app).
# Review again when a fix is published.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge, used by the Expo CLI's development code signing
    - GHSA-vfj7-8cjw-p6xm # braces, used by Metro's file watcher through micromatch
